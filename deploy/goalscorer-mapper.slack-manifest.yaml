# Slack app for the goalscorer-mapper bot (#goalscorer-alerts).
# api.slack.com/apps → Create New App → From an app manifest → paste this.
# Socket Mode means no request URLs: the pod connects out to Slack.
# Runbook: docs/goalscorer-mapper.md → "Slack app".
display_information:
  name: Goalscorer Mapper
  description: Kalshi goalscorer mapping — review cards, league adds, one-off match mapping.
features:
  bot_user:
    display_name: goalscorer-mapper
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write          # cards, summaries, thread replies, ephemeral refusals
      - files:write         # daily PnL PDF
      - channels:history    # channel commands (public channel)
      - groups:history      # channel commands (private channel)
      - channels:join       # joins the channel on startup — no invite needed if public
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
