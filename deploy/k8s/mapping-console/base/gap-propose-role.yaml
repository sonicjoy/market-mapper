# Checker SA may create/list gap-propose worker Jobs in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gap-propose-job-runner
  labels:
    app: gap-propose
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gap-propose-job-runner
  labels:
    app: gap-propose
subjects:
  - kind: ServiceAccount
    name: mapping-control-plane
    namespace: mapping-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gap-propose-job-runner
