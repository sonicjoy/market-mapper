# TEST oom-fold-rank CronJob — mirror mapping-console Deployment env.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oom-fold-rank
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: oom-fold-rank
              env:
                - name: GCP_PROJECT
                  value: "marketmaking-test"
                - name: MAPPING_PIPELINE_OOM_FOLD_RANK
                  value: "1"
                - name: MAPPING_PIPELINE_OOM_FOLD_RANK_SOAK
                  value: "1"
                - name: OOM_FOLD_RANK_SOAK_ALERT_HOURLY_ONLY
                  value: "1"
                - name: ALERT_PUBSUB_ENABLED
                  value: "true"
                - name: ALERT_SLACK_CHANNEL
                  value: "#mm-test-app-alerts"
