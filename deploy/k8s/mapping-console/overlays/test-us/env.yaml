# TEST mapping console — BQ + WI stay in marketmaking-test (activation allowed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mapping-console
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: GCP_PROJECT
              value: "marketmaking-test"
            # Comma-separated admin allow-list (roles never come from the request body).
            # Update in-git when the admin set changes. IAP (traders@) → approver by default.
            - name: MAPPING_CP_ADMIN_EMAILS
              value: "joe.luo@whiteswandata.com,dominic.calleja@whiteswandata.com,ben.fothergill@whiteswandata.com,andrey.sapozhenko@whiteswandata.com,luke.bircumshaw@whiteswandata.com,victor.popa@whiteswandata.com,silviu.simeria@whiteswandata.com,henry.jamieson@whiteswandata.com,oliver.webb@whiteswandata.com,maxime.herve@whiteswandata.com,gregory.tod@whiteswandata.com,matthew.ratcliffe@whiteswandata.com"
            # Enforce distinct checker: set to "1" for maker ≠ proposer.
            - name: MAPPING_CP_REQUIRE_MAKER_CHECKER
              value: "0"
            # Test mapper SoT is BQ; console still writes the same tip.
            - name: MAPPING_SOT
              value: "bq"
            # mmmapper#24: Catalog crypto.com overrides go through the override lane
            # (confirmed in market_mapping). Test only; Polymarket (USA) stays off.
            - name: MAPPING_OVERRIDE_LANE
              value: "1"
            # M3c Mapper Chat (V1 alias thin vertical; default Gemini).
            - name: MAPPING_CP_CHAT
              value: "1"
            - name: MAPPING_CP_CHAT_PROVIDER
              value: "gemini"
            - name: MAPPING_CP_CHAT_MODEL
              value: "gemini-3.8-flash"
            - name: MAPPING_CP_CHAT_API_KEY_SECRET
              value: "mm-mapping-bot-gemini-key"
            - name: PRICES_STATE_MERGE_TRANSFER_LOCATION
              value: "us-east4"
