# PROD mapping console — Approve activates when MAPPING_CP_ALLOW_ACTIVATE=1.
# Live mapper SoT is BQ after deploy:mapping-pipeline:prod (ensure_env.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mapping-console
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: GCP_PROJECT
              value: "rs-marketmaking"
            - name: MAPPING_CP_ADMIN_EMAILS
              value: "joe.luo@whiteswandata.com,dominic.calleja@whiteswandata.com,ben.fothergill@whiteswandata.com,andrey.sapozhenko@whiteswandata.com,luke.bircumshaw@whiteswandata.com,victor.popa@whiteswandata.com,silviu.simeria@whiteswandata.com,henry.jamieson@whiteswandata.com,oliver.webb@whiteswandata.com,maxime.herve@whiteswandata.com,gregory.tod@whiteswandata.com,matthew.ratcliffe@whiteswandata.com"
            # Proposer may approve; set to "1" for maker ≠ proposer.
            - name: MAPPING_CP_REQUIRE_MAKER_CHECKER
              value: "0"
            - name: MAPPING_SOT
              value: "bq"
            # mmmapper#24 override lane (owner, 2026-09-27: supervised prod trial). crypto.com
            # overrides are confirmed in market_mapping. Polymarket (USA) stays off.
            - name: MAPPING_OVERRIDE_LANE
              value: "1"
            - name: MAPPING_CP_ALLOW_ACTIVATE
              value: "1"
            - name: MAPPING_CP_CHAT
              value: "1"
            - name: MAPPING_CP_CHAT_PROVIDER
              value: "gemini"
            - name: MAPPING_CP_CHAT_MODEL
              value: "gemini-3.8-flash"
            - name: MAPPING_CP_CHAT_API_KEY_SECRET
              value: "mm-mapping-bot-gemini-key"
            - name: PRICES_STATE_MERGE_TRANSFER_LOCATION
              value: "europe-west2"
            # R_068 G5 Catalog: on prod since G1 schema landed (lift 2026-09-21).
            - name: MAPPING_CP_CATALOG
              value: "1"
