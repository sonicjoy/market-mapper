# ai-validation CronJob: project whose markets_us verdict table is read and written.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-validation
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: ai-validation
              env:
                - name: GCP_PROJECT
                  value: "rs-marketmaking"
