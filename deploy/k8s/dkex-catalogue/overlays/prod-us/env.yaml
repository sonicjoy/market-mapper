# dkex-catalogue CronJob: target project for raw_ingestion_us.dkex_raw.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dkex-catalogue
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: dkex-catalogue
              env:
                - name: GCP_PROJECT
                  value: "rs-marketmaking"
                - name: DKEX_MISSING_SINGLE_FALLBACK
                  value: "1"
