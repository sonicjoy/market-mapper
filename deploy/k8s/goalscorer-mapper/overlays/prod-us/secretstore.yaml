# ESO onboarding for ns goalscorer-mapper, applied by this app's own deploy (no
# apply-stores.sh step). The GSA + per-secret grants are mm-infrastructure eso.tf
# module "eso_goalscorer_mapper"; until that is applied the ExternalSecret stays
# un-Ready and deploy.sh fails loudly — re-run the deploy after the apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-sync
  annotations:
    iam.gke.io/gcp-service-account: eso-goalscorer-mapper@rs-marketmaking.iam.gserviceaccount.com
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: rs-marketmaking
      auth:
        workloadIdentity:
          clusterLocation: us-east4-b
          clusterName: primary-cluster-us
          serviceAccountRef:
            name: eso-sync
