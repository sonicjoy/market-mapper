# Slack tokens for the goalscorer app (Socket Mode), via secretstore.yaml.
# GSM containers + grant: mm-infrastructure modules/secrets + eso.tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: goalscorer-slack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: goalscorer-slack
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: goalscorer_slack_bot_token
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: goalscorer_slack_app_token
