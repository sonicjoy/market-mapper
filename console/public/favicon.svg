<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Estate tab family: green on black (same pair as the ticker, oddscreen and the consoles portal).
       Two nodes and the link between them, because a mapping is exactly one thing pinned to another,
       and two dots plus a bar still read at 16px. -->
  <rect width="512" height="512" rx="96" fill="#0d0d0d"/>
  <path d="M162 186 L350 326" stroke="#00e676" stroke-width="40" stroke-linecap="round" opacity=".55"/>
  <circle cx="162" cy="186" r="62" fill="#00e676"/>
  <circle cx="350" cy="326" r="62" fill="#00e676"/>
</svg>
