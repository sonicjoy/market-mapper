.deploy:
  image: google/cloud-sdk:slim
  stage: deploy
  timeout: 2h
  variables:
    VM_REPO_USER: gtod
    VM_REPO_DIR: /home/gtod/mmmapper
    # gcloud derives the SSH username from whoami. The cloud-sdk image runs as
    # root, but Debian VMs block root SSH — use a non-root user so metadata keys
    # land as gcloudci (auto-created on the VM with passwordless sudo).
    GCLOUD_SSH_USER: gcloudci
    GCLOUD_SSH_KEY_FILE: /home/gcloudci/.ssh/google_compute_engine
    # Scoped deploy identity (mm-infrastructure mmmapper_deploy.tf): instance-scoped compute +
    # IAP tunnel on the mapper VM only. The runner holds nothing but tokenCreator on it.
    DEPLOY_SA: mmmapper-deploy@$GCP_PROJECT.iam.gserviceaccount.com
  before_script:
    - apt-get update -qq && apt-get install -y -qq sudo
    - id "$GCLOUD_SSH_USER" &>/dev/null || useradd -m -s /bin/bash "$GCLOUD_SSH_USER"
    - install -d -m700 "/home/$GCLOUD_SSH_USER/.ssh"
    # Normalize the File variable: strip CR (CRLF) and guarantee a trailing
    # newline, otherwise OpenSSH rejects the key with "error in libcrypto".
    - sed -e 's/\r$//' "$GCP_DEPLOY_SSH_KEY" > "$GCLOUD_SSH_KEY_FILE"
    - printf '\n' >> "$GCLOUD_SSH_KEY_FILE"
    - chmod 600 "$GCLOUD_SSH_KEY_FILE"
    - ssh-keygen -y -f "$GCLOUD_SSH_KEY_FILE" > "${GCLOUD_SSH_KEY_FILE}.pub"
    - chmod 644 "${GCLOUD_SSH_KEY_FILE}.pub"
    - chown -R "$GCLOUD_SSH_USER:$GCLOUD_SSH_USER" "/home/$GCLOUD_SSH_USER"
    # No credential file. The runner has ambient Workload Identity; gcloud picks it up from the
    # metadata server (reachable for any OS user on the pod) and exchanges it for a short-lived
    # token on the scoped deploy GSA via --impersonate-service-account below.
    - sudo -u "$GCLOUD_SSH_USER" env "PATH=$PATH" gcloud config set project "$GCP_PROJECT"
  script:
    # Ship the CI checkout to the VM (no GitLab credentials on the VM).
    # Exclude .git so the VM keeps its own repo; the archive only refreshes source.
    # Job-unique remote path avoids ownership collisions between concurrent jobs.
    - tar czf /tmp/mmmapper-src.tgz --exclude='./.venv' --exclude='./data' --exclude='./.git' -C "$CI_PROJECT_DIR" .
    - chown "$GCLOUD_SSH_USER:$GCLOUD_SSH_USER" /tmp/mmmapper-src.tgz
    - REMOTE_ARCHIVE="/tmp/mmmapper-src-${CI_JOB_ID}.tgz"
    - |
      sudo -u "$GCLOUD_SSH_USER" env "PATH=$PATH" gcloud compute scp /tmp/mmmapper-src.tgz \
        "$VM_NAME:$REMOTE_ARCHIVE" \
        --zone="$VM_ZONE" \
        --project="$GCP_PROJECT" \
        --impersonate-service-account="$DEPLOY_SA" \
        --tunnel-through-iap \
        --ssh-key-file="$GCLOUD_SSH_KEY_FILE" \
        --scp-flag="-o StrictHostKeyChecking=no"
    # Extract first (this restores infra/deploy.sh), sync git to the CI commit,
    # refresh deps, and record infra/DEPLOYED.  CI_JOB_TOKEN is job-scoped —
    # not stored on the VM; origin is scrubbed to a credential-free URL after fetch.
    - DEPLOY_FETCH_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/whiteswandata/marketmaking/mmmapper.git"
    - |
      sudo -u "$GCLOUD_SSH_USER" env "PATH=$PATH" gcloud compute ssh "$VM_NAME" \
        --zone="$VM_ZONE" \
        --project="$GCP_PROJECT" \
        --impersonate-service-account="$DEPLOY_SA" \
        --tunnel-through-iap \
        --ssh-key-file="$GCLOUD_SSH_KEY_FILE" \
        --ssh-flag="-o StrictHostKeyChecking=no" \
        --command "sudo -u $VM_REPO_USER tar xzf $REMOTE_ARCHIVE -C $VM_REPO_DIR && sudo rm -f $REMOTE_ARCHIVE && sudo -u $VM_REPO_USER bash $VM_REPO_DIR/infra/deploy.sh --refresh-deps --commit $CI_COMMIT_SHA --ref $CI_COMMIT_REF_NAME --fetch-url '$DEPLOY_FETCH_URL'"

deploy:mapping-pipeline:test:
  extends: .deploy
  tags: [wsd-test-us]
  variables:
    GCP_PROJECT: marketmaking-test
    GCP_DEPLOY_SSH_KEY: $GCP_DEPLOY_SSH_KEY_TEST
    VM_NAME: $VM_NAME_TEST
    VM_ZONE: $VM_ZONE_TEST
  environment:
    name: test
  rules:
    - if: $CI_COMMIT_BRANCH == "test"

deploy:mapping-pipeline:prod:
  extends: .deploy
  tags: [wsd-prod-uk]
  # Explicit, not left to stage order: a later edit adding needs: would
  # otherwise silently stop waiting for the gate.
  needs:
    - { job: "regression:mapping-gate", artifacts: false }
    - { job: "pyright", artifacts: false }
    - { job: "quality", artifacts: false }
  variables:
    GCP_PROJECT: rs-marketmaking
    GCP_DEPLOY_SSH_KEY: $GCP_DEPLOY_SSH_KEY_PROD
    VM_NAME: $VM_NAME_PROD
    VM_ZONE: $VM_ZONE_PROD
  environment:
    name: production
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
