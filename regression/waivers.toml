# Reviewed excuses for expected gate deltas.  Empty file = strict
# gate (zero deltas or fail).  Policy: README "Gate policy";
# mechanics: waivers.py.  A waiver is born in the MR whose change it
# excuses and dies in the re-bless commit that absorbs it.
#
# Shape (all fields required; unknown keys are rejected):
#
# [[waiver]]
# id = "mlb-poly-f5-enablement"
# reason = "MLB F5 game lines enabled for Polymarket (MM-231, e5666a5)"
# match = { direction = "added", league = "mlb", sportsbook = "polymarket", market_type_prefix = "f5_" }
# max_rows = 300
# expires = 2026-09-11

